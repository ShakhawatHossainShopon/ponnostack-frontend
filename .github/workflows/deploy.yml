name: Build Next.js & Deploy to Hosting via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Storefront
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Next.js Static HTML Export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://ponnostack.shop/backend/api' }}
          NEXT_PUBLIC_TENANT_UUID: ${{ secrets.NEXT_PUBLIC_TENANT_UUID || '7f8d3f22-4635-4c0b-914f-8087373f15f0' }}
        run: npm run build

      - name: 🚀 Deploy Built 'out/' Folder to Hosting Subdomain via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          protocol: ftps
          security: loose
